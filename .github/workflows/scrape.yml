name: 定时抓取百合作品索引
on:
  schedule:
    - cron: "0 2 * * *"   # 每天 UTC 2 点（北京时间 10 点）运行一次
  workflow_dispatch:        # 也允许手动点按钮运行

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scraper.py
      - name: 提交更新的数据
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "自动更新作品数据"
          git push
